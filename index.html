<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Only My Smartphone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <video id="camera" playsinline autoplay muted></video>
  <canvas id="slash-canvas" aria-hidden="true"></canvas>
  <div id="motion-overlay" class="motion-overlay" aria-live="polite">
    <div class="motion-row">
      <span class="motion-label">X</span>
      <span id="delta-x" class="motion-value">--</span>
      <span class="motion-label">Y</span>
      <span id="delta-y" class="motion-value">--</span>
      <span class="motion-label">Z</span>
      <span id="delta-z" class="motion-value">--</span>
    </div>
    <div class="motion-row">
      <span class="motion-label">Δ</span>
      <span id="delta-magnitude" class="motion-value">--</span>
      <span class="motion-label">時刻</span>
      <span id="delta-timestamp" class="motion-value">--</span>
    </div>
  </div>
  <audio id="slash-audio" preload="auto" src="assets/slash.mp3"></audio>
  <div id="motion-permission-gate" class="permission-gate" hidden>
    <div class="permission-card">
      <p id="motion-permission-message">センサー利用を許可すると、加速度を検知できます。</p>
      <button id="request-motion-permission" type="button">センサーアクセスを許可</button>
    </div>
  </div>
  <div class="hud">
    <p id="status" aria-live="polite">初期化中...</p>
    <p id="https-notice" class="hud-notice" aria-live="polite" hidden>このアプリは HTTPS 環境でのみ動作します。カメラやセンサーを利用する際は HTTPS でアクセスしてください。</p>
    <p id="motion-permission-hint" class="hud-hint" aria-live="polite" hidden></p>
    <div class="threshold-control" aria-live="polite">
      <div class="threshold-labels">
        <span class="threshold-title">しきい値</span>
        <span id="threshold-display" class="threshold-value">--</span>
      </div>
      <div class="threshold-inputs">
        <input id="threshold-range" type="range" min="4" max="30" step="0.5" value="9.5" aria-label="しきい値スライダー">
        <input id="threshold-input" type="number" min="0" max="50" step="0.1" value="9.5" inputmode="decimal" aria-label="しきい値を数値入力">
      </div>
    </div>
    <div class="debug-hud" aria-live="polite">
      <div class="debug-row">
        <span class="debug-label">最新Δ</span>
        <span id="magnitude-display" class="debug-value">--</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">モーション許可</span>
        <span id="permission-display" class="debug-value">--</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">カメラ許可</span>
        <span id="camera-permission-display" class="debug-value">--</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">モーション状態</span>
        <span id="motion-state-display" class="debug-value">--</span>
      </div>
    </div>
    <button id="toggle-motion" type="button">加速度検知を開始</button>
  </div>

  <div id="camera-dialog" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="camera-dialog-message" hidden>
    <div class="dialog-content">
      <p id="camera-dialog-message"></p>
      <button id="camera-retry" type="button">カメラを再試行</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
